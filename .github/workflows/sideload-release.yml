name: Sideload release
on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sideload-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium webkit
      - run: pnpm test && pnpm test:webkit
      - run: swift test
      - run: python3 scripts/generate_project.py
      - run: git diff --exit-code -- Quietly.xcodeproj Quietly/Resources/LICENSE.txt
      - run: python3 scripts/test_ios.py --only-testing QuietlyTests --result-bundle test-results/release-native.xcresult
      - run: python3 scripts/package_sideload.py
      - name: Publish early beta and installer source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          repo, tag = os.environ['GITHUB_REPOSITORY'], release['tag']
          output = Path('build/sideload')
          subprocess.run(['gh', 'release', 'create', tag, '--repo', repo,
                          '--target', os.environ['GITHUB_SHA'], '--prerelease',
                          '--title', f"Quietly {release['version']} — early sideloading beta",
                          '--notes-file', str(output / 'RELEASE-NOTES.md'),
                          *[str(p) for p in sorted(output.iterdir()) if p.is_file()]], check=True)
          endpoint = f'repos/{repo}/contents/altstore-source.json'
          current = subprocess.run(['gh', 'api', endpoint], text=True, capture_output=True)
          payload = {'message': f'Publish installer source for {tag}',
                     'content': base64.b64encode((output / 'quietly-source.json').read_bytes()).decode(),
                     'branch': 'main'}
          if current.returncode == 0:
              payload['sha'] = json.loads(current.stdout)['sha']
          elif '404' not in current.stderr:
              raise SystemExit(current.stderr)
          subprocess.run(['gh', 'api', '--method', 'PUT', endpoint, '--input', '-'],
                         input=json.dumps(payload), text=True, check=True, stdout=subprocess.DEVNULL)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sideload-validation
          path: test-results/
